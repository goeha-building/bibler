<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOEHA BIBLER</title>
    <style>
        :root { --primary: #6c5ce7; --bg: #f0f2f5; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); width: 90%; max-width: 450px; text-align: center; }
        h1 { color: #2d3436; font-size: 1.8rem; margin-bottom: 10px; }
        #verse { font-style: italic; font-size: 1.25rem; color: #636e72; margin: 30px 0; min-height: 80px; line-height: 1.6; }
        #ref { display: block; font-weight: 700; color: var(--primary); margin-bottom: 30px; }
        .btn { background: var(--primary); color: white; border: none; padding: 16px 32px; border-radius: 16px; cursor: pointer; font-size: 1.1rem; font-weight: 600; transition: 0.3s; width: 100%; }
        .btn:hover { background: #a29bfe; transform: translateY(-2px); }
        .video-container { margin-top: 30px; position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 12px; background: #000; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="card">
        <h1>📖 Bible & Hymn</h1>
        <p style="color:#b2bec3;">Press the button for inspiration</p>
        <div id="verse">Ready to inspire you...</div>
        <span id="ref"></span>
        <button class="btn" onclick="getNext()">Get Random Verse ✨</button>
        <div class="video-container" id="player-container">
            </div>
    </div>

    <script>
        async function getNext() {
            try {
                const res = await fetch('/get_data?t=' + Date.now());
                const data = await res.json();
                
                document.getElementById('verse').innerText = `"${data.verse}"`;
                document.getElementById('ref').innerText = data.ref;
                
                const currentUrl = window.location.origin;
                document.getElementById('player-container').innerHTML = `
                    <iframe src="https://www.youtube.com/embed/${data.youtube_id}?origin=${currentUrl}&enablejsapi=1" 
                    frameborder="0" allowfullscreen></iframe>`;
            } catch (e) {
                console.error("뜌땨땨 에러!", e);
            }
        }
        window.onload = getNext;
    </script>
</body>
</html>
